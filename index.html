<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner Inteligente A5 - Microevaluación</title>
  <script src="jsqr.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabecera de la App */
    header {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-text h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: #1f2937;
      color: #f8fafc;
      border: 1px solid #374151;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-icon.active {
      background: #f59e0b;
      color: #000;
      border-color: #fbbf24;
    }

    /* Visor de Cámara Principal */
    .viewport-container {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 440px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
    }

    canvas.overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Retícula de Enfoque en Pantalla (HUD) */
    .hud-guide {
      position: absolute;
      width: 84%;
      height: 70%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      pointer-events: none;
      z-index: 6;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .hud-guide {
      transition: opacity 0.25s ease, border-color 0.2s ease;
    }

    .hud-guide.tracking {
      opacity: 0.05;
      pointer-events: none;
    }

    .hud-guide.locked {
      opacity: 0;
    }

    .corner-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #ffffff;
      border-style: solid;
      pointer-events: none;
    }

    .hud-guide.locked .corner-bracket {
      border-color: #22c55e;
    }

    .c-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
    .c-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
    .c-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
    .c-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }

    /* Barra de Estado Superior en el Visor */
    .status-badge {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .status-badge.locked {
      background: rgba(22, 101, 52, 0.9);
      border-color: #22c55e;
    }

    .status-badge.locked .status-dot {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* Medidores de Calidad en Vivo (Nitidez + Estabilidad) */
    .quality-metrics {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .metric-card {
      flex: 1;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #ef4444;
      border-radius: 3px;
      transition: width 0.1s ease, background 0.2s;
    }

    /* Panel de Control Inferior */
    .controls-panel {
      background: #111827;
      border-top: 1px solid #1f2937;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-main {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #1f2937;
      color: #e2e8f0;
      border: 1px solid #374151;
      padding: 14px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Modal de Captura Congelada (Resultado) */
    .capture-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .capture-modal.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .card-preview-box {
      background: #1f2937;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid #374151;
      max-width: 500px;
      margin: auto;
      width: 100%;
    }

    .preview-img-container {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #22c55e;
      background: #000;
    }

    .preview-img-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .student-badge-result {
      background: #0f172a;
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 4px solid #22c55e;
    }

    .badge-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .badge-details {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
      display: flex;
      gap: 12px;
    }

    .metrics-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-pill {
      background: #111827;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #374151;
    }

    .stat-pill .val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #22c55e;
    }

    .stat-pill .lbl {
      font-size: 0.68rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .btn-next {
      background: #22c55e;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <header>
    <div class="brand">
      <div class="brand-icon">📷</div>
      <div class="brand-text">
        <h1>Escáner de Aula A5</h1>
        <p>Auto-Disparo por Nitidez y QR</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-fullscreen" onclick="toggleFullscreen()" title="Pantalla completa (Ocultar barra web)">⛶</button>
      <button class="btn-icon" id="btn-torch" onclick="toggleTorch()" title="Encender linterna">🔦</button>
      <button class="btn-icon" id="btn-switch" onclick="switchCamera()" title="Cambiar cámara">🔄</button>
    </div>
  </header>

  <!-- Visor de la cámara -->
  <div class="viewport-container" id="viewport">
    <video id="video-feed" playsinline autoplay muted></video>
    <canvas id="overlay-canvas" class="overlay"></canvas>

    <!-- Indicador de Estado Flotante -->
    <div class="status-badge" id="status-badge">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Apuntando cámara a la ficha...</span>
    </div>

    <!-- Retícula HUD -->
    <div class="hud-guide" id="hud-guide">
      <div class="corner-bracket c-tl"></div>
      <div class="corner-bracket c-tr"></div>
      <div class="corner-bracket c-bl"></div>
      <div class="corner-bracket c-br"></div>
    </div>

    <!-- Medidores de Calidad en tiempo real -->
    <div class="quality-metrics">
      <div class="metric-card">
        <div class="metric-header">
          <span>Cobertura (Cerca)</span>
          <span id="val-coverage">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="bar-coverage"></div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-header">
          <span>Nitidez</span>
          <span id="val-sharpness">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="bar-sharpness"></div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-header">
          <span>Estabilidad</span>
          <span id="val-stability">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="bar-stability"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles Inferiores -->
  <div class="controls-panel">
    <div class="action-row">
      <button class="btn-main" id="btn-start" onclick="toggleCamera()">
        <span>▶ Iniciar Cámara</span>
      </button>
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(event)">
      <button class="btn-secondary" onclick="document.getElementById('file-input').click()" title="Probar con foto guardada">
        📁 Probar Foto
      </button>
    </div>
  </div>

  <!-- Modal de Captura Congelada (Zero-Click Result) -->
  <div class="capture-modal" id="capture-modal">
    <div class="card-preview-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:700; color:#22c55e; font-size:0.88rem;">📸 ¡CAPTURA PERFECTA CONGELADA!</span>
        <button onclick="closeModal()" style="background:none; border:none; color:#94a3b8; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <div class="preview-img-container">
        <img id="captured-img" src="" alt="Captura de ficha">
      </div>

      <div class="student-badge-result">
        <div class="badge-name" id="res-student-name">MATEO GARCÍA RODRÍGUEZ</div>
        <div class="badge-details">
          <span id="res-student-id">ID: ALUM_01</span>
          <span id="res-test-id">Respuesta Esperada: 85</span>
        </div>
      </div>

      <div class="metrics-summary">
        <div class="stat-pill">
          <div class="val" id="res-sharpness">94%</div>
          <div class="lbl">Índice de Nitidez</div>
        </div>
        <div class="stat-pill">
          <div class="val" id="res-time">0.18 s</div>
          <div class="lbl">Tiempo de Enfoque</div>
        </div>
      </div>

      <button class="btn-next" onclick="nextScan()">
        ✓ Escanear Siguiente Alumno
      </button>
    </div>
  </div>

  <!-- Motor de Audio Sintético (Web Audio API) y Algoritmo de Captura -->
  <script>
    let videoStream = null;
    let isScanning = false;
    let currentFacingMode = 'environment';
    let torchActive = false;
    let track = null;

    const video = document.getElementById('video-feed');
    const overlay = document.getElementById('overlay-canvas');
    const ctx = overlay.getContext('2d');

    // Canvas de procesamiento en memoria
    const procCanvas = document.createElement('canvas');
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

    let stableFrameCount = 0;
    const REQUIRED_STABLE_FRAMES = 3; // 3 cuadros continuos (~150-200ms) para garantizar estabilidad absoluta
    const COVERAGE_THRESHOLD = 45; // Mínimo 45% de cobertura de la pantalla para permitir disparo
    const SHARPNESS_THRESHOLD = 60; // Umbral calibrado de alta nitidez (mínimo 60%)
    let lastDetectedQR = null;
    let scanStartTime = null;
    let targetLockStartTime = null;

    // SINTETIZADOR DE AUDIO (Cero archivos externos)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880 Hz (La5, tono claro)
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playDing() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const chords = [523.25, 659.25, 783.99]; // Acorde Do Mayor brillante
      chords.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      });
    }

    // MODO PANTALLA COMPLETA (Ocultar barra de navegación web de Android Chrome)
    function enterFullscreen() {
      const docEl = document.documentElement;
      const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
      if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
        req.call(docEl).then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }).catch(() => {});
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        enterFullscreen();
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (exit) exit.call(document).catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

    function updateFullscreenIcon() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const btn = document.getElementById('btn-fullscreen');
      if (btn) {
        btn.innerHTML = isFs ? '🗗' : '⛶';
        btn.classList.toggle('active', isFs);
        btn.title = isFs ? 'Salir de pantalla completa' : 'Pantalla completa (Ocultar barra web)';
      }
    }

    // INICIAR / DETENER CÁMARA
    async function toggleCamera() {
      const btn = document.getElementById('btn-start');
      if (isScanning) {
        stopCamera();
        btn.innerHTML = '<span>▶ Iniciar Cámara</span>';
        btn.style.background = '#2563eb';
      } else {
        enterFullscreen(); // Ocultar barra de navegación de Chrome automáticamente
        await startCamera();
        if (isScanning) {
          btn.innerHTML = '<span>⏹ Detener Cámara</span>';
          btn.style.background = '#ef4444';
        }
      }
    }

    async function startCamera() {
      try {
        const constraints = {
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };

        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = videoStream;
        track = videoStream.getVideoTracks()[0];

        // Intentar activar autoenfoque continuo de hardware en Android
        try {
          if (track && track.applyConstraints) {
            await track.applyConstraints({
              advanced: [{ focusMode: "continuous" }]
            });
          }
        } catch (e) {}

        await new Promise(resolve => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        procCanvas.width = 960;
        procCanvas.height = Math.round((960 * video.videoHeight) / video.videoWidth);

        isScanning = true;
        scanStartTime = Date.now();
        targetLockStartTime = null;
        requestAnimationFrame(processFrame);
      } catch (err) {
        alert('No se pudo acceder a la cámara: ' + err.message);
      }
    }

    function stopCamera() {
      isScanning = false;
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      resetHUD();
    }

    async function switchCamera() {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      if (isScanning) {
        stopCamera();
        await startCamera();
      }
    }

    async function toggleTorch() {
      if (!track || !track.getCapabilities) return;
      const capabilities = track.getCapabilities();
      if (!capabilities.torch) {
        alert('La linterna no está disponible en esta cámara');
        return;
      }
      torchActive = !torchActive;
      await track.applyConstraints({ advanced: [{ torch: torchActive }] });
      document.getElementById('btn-torch').classList.toggle('active', torchActive);
    }

    // Detector nativo de Android Chrome si está disponible
    let nativeBarcodeDetector = null;
    if ('BarcodeDetector' in window) {
      try {
        nativeBarcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {
        nativeBarcodeDetector = null;
      }
    }

    // ALGORITMO DE ESTIMACIÓN DE NITIDEZ (Frecuencias altas / Varianza de gradiente)
    function calculateSharpness(imgData) {
      const data = imgData.data;
      const width = imgData.width;
      const height = imgData.height;
      let totalGradient = 0;
      let sampleCount = 0;

      for (let y = 1; y < height - 1; y += 4) {
        for (let x = 1; x < width - 1; x += 4) {
          const idx = (y * width + x) * 4;
          const lumCenter = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
          const lumRight = (data[idx + 4] + data[idx + 5] + data[idx + 6]) / 3;
          const lumDown = (data[((y + 1) * width + x) * 4] + data[((y + 1) * width + x) * 4 + 1]) / 2;

          const dx = Math.abs(lumCenter - lumRight);
          const dy = Math.abs(lumCenter - lumDown);
          totalGradient += (dx + dy);
          sampleCount++;
        }
      }

      const avgGradient = totalGradient / sampleCount;
      const sharpnessScore = Math.min(100, Math.round((avgGradient / 15) * 100));
      return sharpnessScore;
    }

    // MÓDULO MATEMÁTICO: Estimación de Cuadrilátero A5 y Deformación de Perspectiva
    function estimateSheetQuad(qTL, qTR, qBR, qBL) {
      const vx = {
        x: ((qTR.x - qTL.x) + (qBR.x - qBL.x)) / 2,
        y: ((qTR.y - qTL.y) + (qBR.y - qBL.y)) / 2
      };
      const vy = {
        x: ((qBL.x - qTL.x) + (qBR.x - qTR.x)) / 2,
        y: ((qBL.y - qTL.y) + (qBR.y - qTR.y)) / 2
      };

      // Calibrado con margen exterior de 3.5mm hacia afuera de los 4 marcadores negros
      // para asegurar que los 4 cuadrados negros queden 100% íntegros y holgados dentro de la foto
      const uL = -5.91; // Margen exterior izquierdo
      const uR = 1.563; // Margen exterior derecho
      const vT = -0.259; // Margen exterior superior
      const vB = 4.905; // Margen exterior inferior

      return {
        pTL: { x: qTL.x + uL * vx.x + vT * vy.x, y: qTL.y + uL * vx.y + vT * vy.y },
        pTR: { x: qTL.x + uR * vx.x + vT * vy.x, y: qTL.y + uR * vx.y + vT * vy.y },
        pBR: { x: qTL.x + uR * vx.x + vB * vy.x, y: qTL.y + uR * vx.y + vB * vy.y },
        pBL: { x: qTL.x + uL * vx.x + vB * vy.x, y: qTL.y + uL * vx.y + vB * vy.y }
      };
    }

    // SENSOR DE SEGURIDAD: Verificar que los 4 marcadores negros estén dentro del lente
    function checkCornersInFrame(quad, width, height, margin = 14) {
      const corners = [
        { id: 'TL', name: 'superior izquierda', p: quad.pTL },
        { id: 'TR', name: 'superior derecha', p: quad.pTR },
        { id: 'BR', name: 'inferior derecha', p: quad.pBR },
        { id: 'BL', name: 'inferior izquierda', p: quad.pBL }
      ];

      const outside = [];
      for (const c of corners) {
        if (c.p.x < margin || c.p.x > width - margin || c.p.y < margin || c.p.y > height - margin) {
          outside.push(c);
        }
      }

      return {
        isFullyInside: outside.length === 0,
        outsideCorners: outside
      };
    }

    function getQuadArea(pTL, pTR, pBR, pBL) {
      const x = [pTL.x, pTR.x, pBR.x, pBL.x];
      const y = [pTL.y, pTR.y, pBR.y, pBL.y];
      let area = 0;
      for (let i = 0; i < 4; i++) {
        const j = (i + 1) % 4;
        area += x[i] * y[j] - x[j] * y[i];
      }
      return Math.abs(area) / 2;
    }

    function renderPerspectiveWarp(sourceCanvas, quad, destWidth, destHeight) {
      const destCanvas = document.createElement('canvas');
      destCanvas.width = destWidth;
      destCanvas.height = destHeight;
      const ctx = destCanvas.getContext('2d');

      const subdivisions = 8;
      for (let i = 0; i < subdivisions; i++) {
        for (let j = 0; j < subdivisions; j++) {
          const u0 = i / subdivisions;
          const v0 = j / subdivisions;
          const u1 = (i + 1) / subdivisions;
          const v1 = (j + 1) / subdivisions;

          const dx0 = u0 * destWidth;
          const dy0 = v0 * destHeight;
          const dx1 = u1 * destWidth;
          const dy1 = v1 * destHeight;

          function interp(u, v) {
            const topX = quad.pTL.x + u * (quad.pTR.x - quad.pTL.x);
            const topY = quad.pTL.y + u * (quad.pTR.y - quad.pTL.y);
            const botX = quad.pBL.x + u * (quad.pBR.x - quad.pBL.x);
            const botY = quad.pBL.y + u * (quad.pBR.y - quad.pBL.y);
            return {
              x: topX + v * (botX - topX),
              y: topY + v * (botY - topY)
            };
          }

          const p00 = interp(u0, v0);
          const p10 = interp(u1, v0);
          const p11 = interp(u1, v1);
          const p01 = interp(u0, v1);

          drawTriangleAffine(ctx, sourceCanvas, p00, p10, p01, {x: dx0, y: dy0}, {x: dx1, y: dy0}, {x: dx0, y: dy1});
          drawTriangleAffine(ctx, sourceCanvas, p10, p11, p01, {x: dx1, y: dy0}, {x: dx1, y: dy1}, {x: dx0, y: dy1});
        }
      }
      return destCanvas;
    }

    function drawTriangleAffine(destCtx, srcImg, s0, s1, s2, d0, d1, d2) {
      const x0 = s0.x, y0 = s0.y;
      const x1 = s1.x, y1 = s1.y;
      const x2 = s2.x, y2 = s2.y;

      const det = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
      if (Math.abs(det) < 1e-6) return;

      const u0 = d0.x, u1 = d1.x, u2 = d2.x;
      const v0 = d0.y, v1 = d1.y, v2 = d2.y;

      const a = (u0 * (y1 - y2) + u1 * (y2 - y0) + u2 * (y0 - y1)) / det;
      const c = (u0 * (x2 - x1) + u1 * (x0 - x2) + u2 * (x1 - x0)) / det;
      const e = (u0 * (x1 * y2 - x2 * y1) + u1 * (x2 * y0 - x0 * y2) + u2 * (x0 * y1 - x1 * y0)) / det;

      const b = (v0 * (y1 - y2) + v1 * (y2 - y0) + v2 * (y0 - y1)) / det;
      const d = (v0 * (x2 - x1) + v1 * (x0 - x2) + v2 * (x1 - x0)) / det;
      const f = (v0 * (x1 * y2 - x2 * y1) + v1 * (x2 * y0 - x0 * y2) + v2 * (x0 * y1 - x1 * y0)) / det;

      destCtx.save();
      destCtx.beginPath();
      destCtx.moveTo(d0.x, d0.y);
      destCtx.lineTo(d1.x, d1.y);
      destCtx.lineTo(d2.x, d2.y);
      destCtx.closePath();
      destCtx.clip();

      destCtx.transform(a, b, c, d, e, f);
      destCtx.drawImage(srcImg, 0, 0);
      destCtx.restore();
    }

    let isProcessing = false;

    // CICLO DE PROCESAMIENTO EN TIEMPO REAL (Gatekeeper continuo)
    async function processFrame() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA && !isProcessing) {
        isProcessing = true;
        try {
          procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
          const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);

          const sharpness = calculateSharpness(imgData);
          updateSharpnessUI(sharpness);

          ctx.clearRect(0, 0, overlay.width, overlay.height);

          let detectedText = null;
          let detectedBox = null;

          // 1. Probar primero con el BarcodeDetector nativo (ultra rápido en Android)
          if (nativeBarcodeDetector) {
            try {
              const barcodes = await nativeBarcodeDetector.detect(video);
              if (barcodes && barcodes.length > 0) {
                detectedText = barcodes[0].rawValue;
                const pts = barcodes[0].cornerPoints;
                if (pts && pts.length >= 4) {
                  detectedBox = { p1: pts[0], p2: pts[1], p3: pts[2], p4: pts[3] };
                }
              }
            } catch (err) {}
          }

          // 2. Si no se detectó con el nativo, usar jsQR
          if (!detectedText && typeof jsQR !== 'undefined') {
            const qrCode = jsQR(imgData.data, imgData.width, imgData.height, {
              inversionAttempts: "attemptBoth",
            });
            if (qrCode) {
              detectedText = qrCode.data;
              const sx = overlay.width / procCanvas.width;
              const sy = overlay.height / procCanvas.height;
              detectedBox = {
                p1: { x: qrCode.location.topLeftCorner.x * sx, y: qrCode.location.topLeftCorner.y * sy },
                p2: { x: qrCode.location.topRightCorner.x * sx, y: qrCode.location.topRightCorner.y * sy },
                p3: { x: qrCode.location.bottomRightCorner.x * sx, y: qrCode.location.bottomRightCorner.y * sy },
                p4: { x: qrCode.location.bottomLeftCorner.x * sx, y: qrCode.location.bottomLeftCorner.y * sy }
              };
            }
          }

          if (detectedText && detectedBox) {
            // Calcular cuadrilátero dinámico de la ficha completa A5
            const sheetQuad = estimateSheetQuad(detectedBox.p1, detectedBox.p2, detectedBox.p3, detectedBox.p4);
            const quadArea = getQuadArea(sheetQuad.pTL, sheetQuad.pTR, sheetQuad.pBR, sheetQuad.pBL);
            const screenArea = overlay.width * overlay.height;
            const coverage = Math.min(100, Math.round((quadArea / screenArea) * 100));

            // Verificar si los 4 cuadrados negros están 100% dentro del encuadre
            const cornerCheck = checkCornersInFrame(sheetQuad, overlay.width, overlay.height);

            // Dibujar cuadrilátero dinámico con brackets AR
            drawDynamicQuadrilateral(sheetQuad, detectedBox, coverage, cornerCheck);

            handleValidTarget(detectedText, sharpness, sheetQuad, coverage, cornerCheck);
          } else {
            targetLockStartTime = null;
            handleLostTarget();
          }
        } finally {
          isProcessing = false;
        }
      }

      if (isScanning) {
        requestAnimationFrame(processFrame);
      }
    }

    // DIBUJO DEL CUADRILÁTERO DINÁMICO EN TIEMPO REAL (AR)
    function drawDynamicQuadrilateral(quad, qrBox, coverage, cornerCheck) {
      const isFullyInside = cornerCheck.isFullyInside;
      const isOptimalDistance = coverage >= COVERAGE_THRESHOLD;

      let color = '#22c55e'; // Verde
      let fillColor = 'rgba(34, 197, 94, 0.12)';
      let isDashed = false;
      let labelText = `✓ ¡Distancia Óptima! (${coverage}%)`;

      if (!isFullyInside) {
        // Alerta roja: Una o más esquinas están fuera de la pantalla
        color = '#ef4444';
        fillColor = 'rgba(239, 68, 68, 0.14)';
        isDashed = true;

        const hasLeft = cornerCheck.outsideCorners.some(c => c.id === 'TL' || c.id === 'BL');
        const hasRight = cornerCheck.outsideCorners.some(c => c.id === 'TR' || c.id === 'BR');
        const hasTop = cornerCheck.outsideCorners.some(c => c.id === 'TL' || c.id === 'TR');
        const hasBottom = cornerCheck.outsideCorners.some(c => c.id === 'BL' || c.id === 'BR');

        if (hasLeft && !hasRight) {
          labelText = '⚠️ Mueve la cámara a la izquierda ⬅️';
        } else if (hasRight && !hasLeft) {
          labelText = '⚠️ Mueve la cámara a la derecha ➡️';
        } else if (hasTop && !hasBottom) {
          labelText = '⚠️ Mueve la cámara hacia arriba ⬆️';
        } else if (hasBottom && !hasTop) {
          labelText = '⚠️ Mueve la cámara hacia abajo ⬇️';
        } else {
          labelText = '⚠️ Aleja un poco: faltan esquinas en pantalla';
        }
      } else if (!isOptimalDistance) {
        // Advertencia amarilla: Está demasiado lejos
        color = '#f59e0b';
        fillColor = 'rgba(245, 158, 11, 0.08)';
        isDashed = true;
        labelText = `⚠️ Acércate a la hoja (${coverage}% / ${COVERAGE_THRESHOLD}%)`;
      }

      ctx.save();

      // 1. Polígono de la ficha
      ctx.beginPath();
      ctx.moveTo(quad.pTL.x, quad.pTL.y);
      ctx.lineTo(quad.pTR.x, quad.pTR.y);
      ctx.lineTo(quad.pBR.x, quad.pBR.y);
      ctx.lineTo(quad.pBL.x, quad.pBL.y);
      ctx.closePath();

      ctx.fillStyle = fillColor;
      ctx.fill();

      ctx.lineWidth = isDashed ? 3 : 4;
      ctx.strokeStyle = color;
      if (isDashed) {
        ctx.setLineDash([12, 8]);
      } else {
        ctx.setLineDash([]);
        ctx.shadowColor = '#22c55e';
        ctx.shadowBlur = 12;
      }
      ctx.stroke();
      ctx.restore();

      // 2. Brackets en las 4 esquinas de la ficha
      drawCornerBracket(quad.pTL, 24, 0, color);
      drawCornerBracket(quad.pTR, 24, Math.PI / 2, color);
      drawCornerBracket(quad.pBR, 24, Math.PI, color);
      drawCornerBracket(quad.pBL, 24, -Math.PI / 2, color);

      // 3. Mini caja del código QR
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(qrBox.p1.x, qrBox.p1.y);
      ctx.lineTo(qrBox.p2.x, qrBox.p2.y);
      ctx.lineTo(qrBox.p3.x, qrBox.p3.y);
      ctx.lineTo(qrBox.p4.x, qrBox.p4.y);
      ctx.closePath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = color;
      ctx.stroke();
      ctx.restore();

      // 4. Etiqueta flotante indicadora de proximidad / centrado
      const centerX = (quad.pTL.x + quad.pTR.x) / 2;
      const centerY = Math.max(25, Math.min(quad.pTL.y, quad.pTR.y) - 18);

      ctx.save();
      ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      const textMetrics = ctx.measureText(labelText);
      const pillW = textMetrics.width + 24;
      const pillH = 30;
      const pillX = centerX - pillW / 2;
      const pillY = centerY - 15;

      ctx.fillStyle = !isFullyInside ? 'rgba(153, 27, 27, 0.94)' : (isOptimalDistance ? 'rgba(22, 101, 52, 0.94)' : 'rgba(120, 53, 15, 0.94)');
      ctx.beginPath();
      ctx.roundRect(pillX, pillY, pillW, pillH, 15);
      ctx.fill();

      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labelText, centerX, pillY + pillH / 2);
      ctx.restore();
    }

    function drawCornerBracket(pt, size, angle, color) {
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(angle);
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, size);
      ctx.lineTo(0, 0);
      ctx.lineTo(size, 0);
      ctx.stroke();
      ctx.restore();
    }

    // CONTROL DE ESTABILIDAD, COBERTURA Y AUTO-DISPARO (Zero-Click Gatekeeper)
    function handleValidTarget(qrData, sharpness, sheetQuad, coverage, cornerCheck) {
      const hud = document.getElementById('hud-guide');
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const statusDot = document.getElementById('status-dot');

      updateCoverageUI(coverage);

      // REGLA 1: Los 4 cuadrados negros deben estar 100% dentro del encuadre
      if (!cornerCheck.isFullyInside) {
        targetLockStartTime = null; // Reiniciar cronómetro: aún no está bien encuadrado
        stableFrameCount = 0;
        updateStabilityUI(0);
        hud.classList.remove('locked');
        hud.classList.add('tracking');
        badge.classList.remove('locked');
        badge.style.background = 'rgba(153, 27, 27, 0.92)';
        statusDot.style.background = '#ef4444';
        statusDot.style.boxShadow = '0 0 10px #ef4444';
        statusText.textContent = '⚠️ Los 4 cuadrados negros deben verse completos en pantalla';
        return;
      }

      // Restaurar estilo normal del badge
      badge.style.background = '';
      statusDot.style.background = '';
      statusDot.style.boxShadow = '';

      // REGLA 2: Cobertura mínima (no muy lejos)
      const isCoverageOk = coverage >= COVERAGE_THRESHOLD;
      if (!isCoverageOk) {
        targetLockStartTime = null; // Reiniciar cronómetro: aún está lejos
        stableFrameCount = 0;
        updateStabilityUI(0);
        hud.classList.remove('locked');
        hud.classList.add('tracking');
        badge.classList.remove('locked');
        statusText.textContent = `Acércate más a la hoja (${coverage}% / ${COVERAGE_THRESHOLD}%)...`;
        return;
      }

      // Los 4 cuadrados están dentro y la distancia es óptima: iniciar conteo de enfoque aquí
      if (!targetLockStartTime) {
        targetLockStartTime = Date.now();
      }

      // REGLA 3: Alta nitidez (>= 60%) y 3 cuadros de estabilidad continua
      const isSharpnessOk = sharpness >= SHARPNESS_THRESHOLD;

      if (isSharpnessOk) {
        stableFrameCount++;
        const stabilityPct = Math.min(100, Math.round((stableFrameCount / REQUIRED_STABLE_FRAMES) * 100));
        updateStabilityUI(stabilityPct);

        badge.classList.add('locked');
        statusText.textContent = `¡Nitidez excelente (${sharpness}%)! Congelando...`;

        // Disparo al completar los cuadros nítidos y estables (~150-200ms)
        if (stableFrameCount >= REQUIRED_STABLE_FRAMES) {
          triggerAutoCapture(qrData, sharpness, null, sheetQuad);
        }
      } else {
        stableFrameCount = Math.max(0, stableFrameCount - 1);
        updateStabilityUI(0);
        badge.classList.remove('locked');
        statusText.textContent = `Encuadre perfecto. Enfocando nitidez (${sharpness}% / ${SHARPNESS_THRESHOLD}%)...`;
      }
    }

    function handleLostTarget() {
      stableFrameCount = 0;
      targetLockStartTime = null;
      updateStabilityUI(0);
      updateCoverageUI(0);
      resetHUD();
    }

    function resetHUD() {
      const hud = document.getElementById('hud-guide');
      const badge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      hud.classList.remove('tracking', 'locked');
      badge.classList.remove('locked');
      statusText.textContent = 'Apuntando cámara a la ficha A5...';
    }

    // DISPARO AUTOMÁTICO CONFIRMADO CON PERSPECTIVE WARP & AUTO-CROP
    function triggerAutoCapture(qrData, sharpness, directDataUrl = null, sheetQuad = null) {
      isScanning = false; // Pausar ciclo
      playBeep(); // Sonido ¡BIP!
      if (navigator.vibrate) navigator.vibrate([70]);

      const hud = document.getElementById('hud-guide');
      hud.classList.add('locked');

      let capturedDataUrl = directDataUrl;
      if (!capturedDataUrl) {
        if (sheetQuad) {
          // Perspective Warp: Recortar y enderezar exactamente la ficha A5 entre sus 4 esquinas
          const warpedCanvas = renderPerspectiveWarp(video, sheetQuad, 1400, 953);
          capturedDataUrl = warpedCanvas.toDataURL('image/jpeg', 0.95);
        } else {
          const highResCanvas = document.createElement('canvas');
          highResCanvas.width = video.videoWidth || 1280;
          highResCanvas.height = video.videoHeight || 720;
          const hCtx = highResCanvas.getContext('2d');
          hCtx.drawImage(video, 0, 0);
          capturedDataUrl = highResCanvas.toDataURL('image/jpeg', 0.92);
        }
      }

      // Decodificar payload: MATEVAL|ID|RESULTADO|NOMBRE o MATEVAL|ID|N1|OP|N2|RESULTADO|NOMBRE
      const parts = qrData.split('|');
      const studentId = parts[1] || 'ALUM_01';
      const studentName = (parts[parts.length - 1] || 'MATEO GARCÍA').replace(/_/g, ' ');
      let expectedAns = '85';
      if (parts.length >= 7) {
        expectedAns = parts[5];
      } else if (parts.length >= 4) {
        expectedAns = parts[2];
      }

      // Mostrar Modal con la captura congelada
      setTimeout(() => {
        document.getElementById('captured-img').src = capturedDataUrl;
        document.getElementById('res-student-name').textContent = studentName.toUpperCase();
        document.getElementById('res-student-id').textContent = 'ID: ' + studentId;
        document.getElementById('res-test-id').textContent = 'Resultado Esperado: ' + expectedAns;
        document.getElementById('res-sharpness').textContent = sharpness + '%';
        const focusDuration = targetLockStartTime ? ((Date.now() - targetLockStartTime) / 1000).toFixed(2) : '0.24';
        document.getElementById('res-time').textContent = focusDuration + ' s';

        document.getElementById('capture-modal').classList.add('open');
        playDing(); // Ding suave de confirmación
      }, 150);
    }

    function updateCoverageUI(val) {
      document.getElementById('val-coverage').textContent = val + '%';
      const bar = document.getElementById('bar-coverage');
      bar.style.width = Math.min(100, Math.round((val / COVERAGE_THRESHOLD) * 100)) + '%';
      bar.style.background = val >= COVERAGE_THRESHOLD ? '#22c55e' : (val >= 25 ? '#f59e0b' : '#ef4444');
    }

    function updateSharpnessUI(val) {
      document.getElementById('val-sharpness').textContent = val + '%';
      const bar = document.getElementById('bar-sharpness');
      bar.style.width = Math.min(100, Math.round((val / SHARPNESS_THRESHOLD) * 100)) + '%';
      bar.style.background = val >= SHARPNESS_THRESHOLD ? '#22c55e' : (val >= 40 ? '#f59e0b' : '#ef4444');
    }

    function updateStabilityUI(val) {
      document.getElementById('val-stability').textContent = val + '%';
      const bar = document.getElementById('bar-stability');
      bar.style.width = val + '%';
      bar.style.background = val === 100 ? '#22c55e' : '#3b82f6';
    }

    function nextScan() {
      closeModal();
      isScanning = true;
      scanStartTime = Date.now();
      stableFrameCount = 0;
      resetHUD();
      requestAnimationFrame(processFrame);
    }

    function closeModal() {
      document.getElementById('capture-modal').classList.remove('open');
      if (!isScanning && videoStream) {
        isScanning = true;
        requestAnimationFrame(processFrame);
      }
    }

    // Soporte para probar con fotos estáticas (desde PC o galería del celular)
    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      scanStartTime = Date.now();
      targetLockStartTime = Date.now() - 250;
      const reader = new FileReader();
      reader.onload = (event) => {
        const dataUrl = event.target.result;
        const img = new Image();
        img.onload = () => {
          procCanvas.width = img.width;
          procCanvas.height = img.height;
          procCtx.drawImage(img, 0, 0);
          const imgData = procCtx.getImageData(0, 0, img.width, img.height);
          const qr = jsQR(imgData.data, imgData.width, imgData.height);
          const sharpness = calculateSharpness(imgData);

          if (qr && qr.data.startsWith('MATEVAL')) {
            const qTL = qr.location.topLeftCorner;
            const qTR = qr.location.topRightCorner;
            const qBR = qr.location.bottomRightCorner;
            const qBL = qr.location.bottomLeftCorner;
            const sheetQuad = estimateSheetQuad(qTL, qTR, qBR, qBL);
            const warpedCanvas = renderPerspectiveWarp(img, sheetQuad, 1400, 953);
            const warpedDataUrl = warpedCanvas.toDataURL('image/jpeg', 0.95);
            triggerAutoCapture(qr.data, sharpness, warpedDataUrl, sheetQuad);
          } else {
            alert('No se detectó un código QR válido de la microevaluación en la imagen.');
          }
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(file);
    }
  </script>
